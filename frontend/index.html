<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🐍 Snakes & Ladders — Grammar Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="lobby">
    <h1>🐍 Snakes & Grammar 🪜</h1>
    <h2>Grammar Quiz!</h2>
    <input id="username" maxlength="24" placeholder="Username">
    <input id="game-id" maxlength="6" placeholder="Game ID to join">
    <div><button id="host-btn">Host Game</button><button id="join-btn">Join Game</button></div>
    <p id="lobby-status"></p>
  </section>

  <section id="game" hidden>
    <header>
      <h1>Grammar Chaos</h1>
      <strong id="game-label"></strong>
    </header>

    <div id="game-over-overlay" class="game-over-overlay hidden">
      <div class="game-over-card">
        <h2>🏆 Winner!</h2>
        <p id="winner-text"></p>
        <button id="restart-btn" class="hidden">Restart Game</button>
      </div>
    </div>

    <div id="controls-row" class="controls-row">
      <div id="roll-indicator" class="roll-indicator" hidden>🎲 Roll: 0</div>
      <button id="roll-btn" class="roll-button" disabled>🎲 Roll</button>
    </div>

    <div id="players"></div>
    <section id="question-panel" hidden>
      <h3 id="question-text"></h3>
      <div id="question-options"></div>
    </section>
    <div id="board"></div>
    <div id="controls">
      <button id="start-btn">Start Game</button>
    </div>
    <section id="chat">
      <div id="chat-messages"></div>
      <input id="chat-input" maxlength="250" placeholder="Chat...">
      <button id="chat-send">Send</button>
    </section>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
